model:
  # Pinned LOCAL snapshot (same 357b5c1f the server runs): offline
  # snapshot_download under a redirected cache_dir cannot resolve the bare
  # repo id (target_utils.py:123-131) and the run must be hub-independent.
  target_model_path: /home/shooting-brake007/.cache/huggingface/hub/models--srswti--axe-superveloce-jota-118b-r15-nvfp4/snapshots/357b5c1f87b70cb89f7f66bee6dbbf90eaee279a
  draft_model_config: experiments/drafter_train/work/warmstart/config.json
  # Exactly one of draft_checkpoint_path / training.resume_from is set by
  # train.sh per run mode; SpecForge overrides are STRING-typed, so a
  # "=null" override cannot unset a value baked in here.
  draft_checkpoint_path: null
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  lm_head_key: lm_head.weight
  torch_dtype: bfloat16
  mask_token_id: 12

data:
  hidden_states_path: experiments/drafter_train/work/features
  max_length: 3072
  chat_template: poolside
  cache_dir: experiments/drafter_train/work/cache
  dataloader_num_workers: 8

training:
  strategy: dflash
  num_epochs: 6
  batch_size: 1
  accumulation_steps: 4
  learning_rate: 6.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  # The 1.12B-param drafter's fp32 masters (~4.5 GB) + Adam moments
  # (~9 GB) do not fit beside activations on a 31.36 GiB 5090 that also
  # carries ~0.6 GB of desktop residents: the first GPU smoke OOM'd
  # exactly inside _multi_tensor_adam on exp_avg_sq (2026-08-25).
  # Offloading masters+moments to host RAM is free here because training
  # runs with serving STOPPED, which releases the 47.4 GiB Intel driver
  # shadow -- host memory is abundant precisely when this needs it.
  optimizer_cpu_offload: true
  attention_backend: flex_attention
  num_anchors: 512
  objective_chunk_blocks: 64
  loss_decay_gamma: 7.0
  loss_type: dflash
  save_interval: 250
  log_interval: 10
  # MEASURED 2026-08-25: one checkpoint is 15 GB (bf16 model + fp32
  # masters + Adam moments). Retaining 3 would claim 45 GB against 82 GB
  # free while the capture set needs tens of GB on the same volume.
  # Newest-only still satisfies resume; export reads the latest.
  max_checkpoints: 1
  dist_timeout: 30
  fsdp_sharding: NO_SHARD
  seed: 42

run_id: jota-r15-dflash
output_dir: experiments/drafter_train/work/checkpoints

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
