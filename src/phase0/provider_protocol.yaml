# Shooting Brake — Versioned Pinned-Memory Provider Protocol
# Version: 1
# Date: 2026-08-04
#
# This is the compatibility boundary between the upstream-vLLM CUDA state
# owner and the isolated persistent B70 provider.  Both sides MUST agree on
# this version at startup; mismatch is a hard fail.
#
# Transport: pinned host memory ring (proven in Colibri reference path).
# No NCCL, no XCCL, no CUDA-XPU direct peer access.

protocol_version: 1

# ---------------------------------------------------------------------------
# Capability handshake (provider → host, at startup)
# ---------------------------------------------------------------------------
capability:
  # The provider reports these once after device selection + weight load.
  # The host validates them against the model manifest before accepting routes.
  fields:
    protocol_version:
      type: uint32
      required: true
      value: 1
    device_name:
      type: string
      required: true
    device_memory_total_bytes:
      type: uint64
      required: true
    device_memory_available_bytes:
      type: uint64
      required: true
    backend:
      type: string
      required: true
      # "quixicore-xpu-nvfp4" (primary)
      # "torch-xpu-llm-scaler" (secondary, INT4 GS128)
    supported_hidden_sizes:
      type: "uint32[]"
      required: true
      # [2048] for Qwen3.6-35B-A3B
    supported_intermediate_sizes:
      type: "uint32[]"
      required: true
      # [512] for Qwen3.6-35B-A3B
    supported_topk:
      type: "uint32[]"
      required: true
      # [8]
    num_resident_experts:
      type: uint32
      required: true
      # count of (layer, expert) pairs loaded into B70 VRAM
    max_batch_remote:
      type: uint32
      required: true
      # maximum M_remote (remote tokens per layer submission)
    kernel_families:
      type: "string[]"
      required: true
      # ["nvfp4_moe_split", "nvfp4_moe_fused"]
    health_heartbeat_interval_ms:
      type: uint32
      default: 1000

# ---------------------------------------------------------------------------
# Placement manifest (host ↔ provider, at startup / generation change)
# ---------------------------------------------------------------------------
placement_manifest:
  # Generated by the host from model config + CUDA budget + B70 capability.
  # Sent to provider before first dispatch. Immutable within a generation.
  version: 1
  fields:
    generation:
      type: uint64
      description: "Incremented on any placement change; provider rejects stale generations."
    layer_count:
      type: uint32
    expert_count:
      type: uint32
    hidden_size:
      type: uint32
    intermediate_size:
      type: uint32
    topk:
      type: uint32
    remote_experts:
      type: "list<{layer: uint32, expert: uint32, compact_slot: uint32}>"
      description: >
        Every (layer, expert) pair whose weights reside on the B70.
        compact_slot is the provider-local index into its expert bank.
    max_concurrent_layers:
      type: uint32
      default: 1
      description: "B70 processes at most this many layers concurrently (initially 1)."

# ---------------------------------------------------------------------------
# Request ring (host → provider, per layer per scheduler step)
# ---------------------------------------------------------------------------
request:
  # Written by host into pinned memory; provider polls.
  # One slot per ring entry; ring wraps with head/tail indices.
  fields:
    generation:
      type: uint64
      required: true
      description: "Must match provider's current generation; stale = rejected."
    layer_idx:
      type: uint32
      required: true
    scheduler_step:
      type: uint64
      required: true
      description: "vLLM scheduler step counter for dedup/ordering."
    m_remote:
      type: uint32
      required: true
      description: "Number of remote tokens in this request (<= max_batch_remote)."
    topk:
      type: uint32
      required: true
    hidden_size:
      type: uint32
      required: true
    # Activation data: [m_remote, hidden_size] fp16
    activation_offset:
      type: uint64
      required: true
      description: "Offset into shared pinned activation buffer."
    activation_dtype:
      type: uint32
      required: true
      enum: { 0: fp32, 1: fp16, 2: bf16 }
    # Route data: [m_remote, topk] int32 expert IDs (compact slot indices)
    topk_ids_offset:
      type: uint64
      required: true
    # Route weights: [m_remote, topk] fp32
    topk_weights_offset:
      type: uint64
      required: true
    # Sequence metadata for dedup/recovery
    token_row_map_offset:
      type: uint64
      required: true
      description: "[m_remote] int32 mapping remote→full batch row index."
  status_values:
    EMPTY: 0
    SUBMITTED: 1
    IN_PROGRESS: 2
    COMPLETED: 3
    FAILED: 4

# ---------------------------------------------------------------------------
# Completion ring (provider → host, per request)
# ---------------------------------------------------------------------------
completion:
  # Written by provider into pinned memory; host polls in qt_take.
  fields:
    generation:
      type: uint64
    layer_idx:
      type: uint32
    scheduler_step:
      type: uint64
    m_remote:
      type: uint32
    # Result partial: [m_remote, hidden_size] fp32
    # CUDA scatters this into full [M, hidden] using token_row_map.
    output_offset:
      type: uint64
      description: "Offset into shared pinned output buffer."
    output_dtype:
      type: uint32
      enum: { 0: fp32 }
    # Per-route failure mask: [m_remote, topk] uint8
    # 0 = contributed, 1 = failed. Host must recover failed routes exactly.
    failed_mask_offset:
      type: uint64
      required: true
    latency_kernel_us:
      type: uint32
    latency_total_us:
      type: uint32
    status:
      type: uint32
      enum: { 0: EMPTY, 1: COMPLETED, 2: FAILED, 3: TIMEOUT }

# ---------------------------------------------------------------------------
# Shared pinned-memory layout
# ---------------------------------------------------------------------------
shared_buffers:
  # Pre-allocated once at startup. Grow-only across the process lifetime.
  activation_buffer:
    dtype: fp16
    max_shape: "[max_batch_total, hidden_size]"
    description: "Shared activation staging area for host writes."
  output_buffer:
    dtype: fp32
    max_shape: "[max_batch_remote, hidden_size]"
    description: "Provider writes weighted partials here."
  topk_ids_buffer:
    dtype: int32
    max_shape: "[max_batch_remote, topk]"
  topk_weights_buffer:
    dtype: fp32
    max_shape: "[max_batch_remote, topk]"
  token_row_map_buffer:
    dtype: int32
    max_shape: "[max_batch_remote]"
  failed_mask_buffer:
    dtype: uint8
    max_shape: "[max_batch_remote, topk]"

# ---------------------------------------------------------------------------
# Ring parameters
# ---------------------------------------------------------------------------
ring:
  num_slots: 8
  # Must be >= max_concurrent_layers + 1 for safe wraparound.
  # Initially 8 (plenty for 1-pending-layer).
  poll_interval_us: 1
  timeout_ms: 5000
  # If no completion within timeout, host treats as failure and recovers.
