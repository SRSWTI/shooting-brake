# ---------------------------------------------------------------------------
# Source checkpoint (higher-precision reference)
# ---------------------------------------------------------------------------
source_checkpoint:
  repo: "Qwen/Qwen3.6-35B-A3B"
  hf_snapshot: "995ad96eacd98c81ed38be0c5b274b04031597b0"
  format: "BF16 safetensors (26 shards, 73 GiB)"
  architecture: "Qwen3_5MoeForConditionalGeneration"
  model_type: "qwen3_5_moe"
  text_config:
    hidden_size: 2048
    num_hidden_layers: 40
    num_experts: 256
    num_experts_per_tok: 8
    moe_intermediate_size: 512
    shared_expert_intermediate_size: 512
    head_dim: 256
    num_attention_heads: 16
    num_key_value_heads: 2
    vocab_size: 248320
    full_attention_interval: 4
    layer_types: "30 linear_attention + 10 full_attention (3:1 hybrid)"
    rope_theta: 10000000
    partial_rotary_factor: 0.25
    mrope_interleaved: true
    mamba_ssm_dtype: float32

# ---------------------------------------------------------------------------
# Expert weight geometry (derived from config)
# ---------------------------------------------------------------------------
expert_geometry:
  per_expert:
    w13_shape: [1024, 2048]    # [2 * moe_intermediate, hidden]
    w2_shape: [2048, 512]      # [hidden, moe_intermediate]
    params_per_expert: 3145728  # 1024*2048 + 2048*512
    bf16_bytes: 6291456         # ~6.0 MiB
    nvfp4_bytes: 1769480        # packed weights + raw E4M3 scales + two FP32 globals
  per_layer:
    experts: 256
    bf16_total_gib: 1.5         # 256 * 6.0 MiB
    nvfp4_total_gib: 0.4219     # 452,986,880 bytes
  checkpoint_layers:
    bf16_equivalent_total_gib: 60.0  # 40 * 1.5 GiB
    nvfp4_layer_count: 32
    nvfp4_expert_bank_gib: 13.50
    fp8_layer_count: 8           # layers 32..39 are FP8, not in the NVFP4 bank

