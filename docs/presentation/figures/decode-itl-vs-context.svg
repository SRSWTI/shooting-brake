<svg font-family="&quot;Liberation Sans&quot;,Helvetica,sans-serif" xmlns="http://www.w3.org/2000/svg" width="1184" height="348" viewBox="0 0 1184 348" role="img" aria-label="Generation speed versus context">
  <rect x="0" y="0" width="1184" height="348" fill="#fbfbf9"/>
    <text x="0" y="14" font-size="12" fill="#9d9da7" letter-spacing="1.2">MILLISECONDS PER GENERATED TOKEN</text>
    <line x1="62" y1="268" x2="862" y2="268" stroke="#cdccc7"/>
    <line x1="62" y1="40" x2="62" y2="268" stroke="#cdccc7"/>
    <g font-size="11" fill="#9d9da7" text-anchor="end">
      <text x="54" y="272">0</text><text x="54" y="196">5</text>
      <text x="54" y="120">10 ms</text><text x="54" y="44">15</text>
    </g>
    <g font-size="11.5" fill="#6e6e79" text-anchor="middle">
      <text x="122" y="288">1K</text><text x="302" y="288">16K</text><text x="482" y="288">32K</text>
      <text x="662" y="288">64K</text><text x="822" y="288">127K</text>
    </g>
    <polyline points="122,95 302,95 482,95 662,95 822,95" fill="none" stroke="#b4552d" stroke-width="2.5"/>
    <text x="128" y="87" font-size="12.5" fill="#b4552d" font-weight="600">ours: 11.40 ms, dead flat at every length</text>
    <polyline points="122,161 302,153 482,146 662,130 822,99" fill="none" stroke="#2f6f4e" stroke-width="2.5"/>
    <g fill="#2f6f4e"><circle cx="122" cy="161" r="4"/><circle cx="302" cy="153" r="4"/>
      <circle cx="482" cy="146" r="4"/><circle cx="662" cy="130" r="4"/><circle cx="822" cy="99" r="4"/></g>
    <text x="128" y="180" font-size="12.5" fill="#2f6f4e" font-weight="600">RTX PRO 6K: gets slower as the conversation fills up</text>
    <circle cx="822" cy="97" r="12" fill="none" stroke="#17171b" stroke-dasharray="3 2"/>
    <text x="700" y="58" font-size="13.5" fill="#17171b" font-weight="600">they meet us here. 1.03&#215;.</text>
    <text x="640" y="330" font-size="12.5" fill="#6e6e79">the RTX PRO 6K bottleneck knows how long your conversation is. ours does not.</text>
  </svg>
